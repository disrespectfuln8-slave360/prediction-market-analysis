[project]
name = "prediction-market-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9.10"
dependencies = [
    "anthropic>=0.40.0",
    "brokenaxes>=0.6.2",
    "cryptography>=46.0.3",
    "duckdb>=1.4.2",
    "httpx>=0.28.1",
    "imageio>=2.36.0",
    "kalshi-python>=2.1.4",
    "matplotlib>=3.9.4",
    "pandas>=2.3.3",
    "polymarket-py>=0.1.0",
    "pyarrow>=18.0.0",
    "scipy>=1.13.1",
    "squarify>=0.4.4",
    "tenacity>=8.0.0",
    "tqdm>=4.67.1",
    "web3>=6.0.0",
    "simple-term-menu>=1.6.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "flask>=3.1.3",
    "py-clob-client>=0.34.6",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# These launchers deliberately load_dotenv() and configure logging before
# importing project modules -- several read env vars or log at import time,
# so the ordering is load-order-dependent, not an oversight.
"run_polyus.py" = ["E402"]
"run_polyus_apex.py" = ["E402"]
"run_polyus_nfl_props.py" = ["E402"]
"run_polyus_sports_props.py" = ["E402"]
"run_polyus_tennis_props.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
